<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gallery — Mehmet Altuğ Altınışık</title>
  <meta name="description" content="Photography gallery by Mehmet Altuğ Altınışık.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%2312A090'/%3E%3Ctext x='32' y='42' font-family='Arial,sans-serif' font-size='26' font-weight='bold' fill='%23fff' text-anchor='middle'%3EMA%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="gallery-page">

  <!-- Scatter gallery — positions are fixed, not random on reload -->
  <main class="scatter-gallery" id="scatterGallery">

    <button class="scatter-gallery__photo" data-index="13" style="--x: 50%; --y: 42%; --w: 28%; --r: 0deg; --z: 5;" aria-label="Open photo 1">
      <img src="fotooo/01.jpg" loading="eager" alt="">
    </button>

    <button class="scatter-gallery__photo" data-index="3" style="--x: 30%; --y: 8%; --w: 18%; --r: 2deg; --z: 3;" aria-label="Open photo 2">
      <img src="fotooo/03.jpg" loading="eager" alt="">
    </button>

    <button class="scatter-gallery__photo" data-index="2" style="--x: 55%; --y: 3%; --w: 24%; --r: -2deg; --z: 6;" aria-label="Open photo 3">
      <img src="fotooo/04.jpg" loading="eager" alt="">
    </button>

    <button class="scatter-gallery__photo" data-index="0" style="--x: 75%; --y: 12%; --w: 20%; --r: 4deg; --z: 2;" aria-label="Open photo 4">
      <img src="fotooo/05.jpg" loading="lazy" alt="">
    </button>

    <button class="scatter-gallery__photo" data-index="1" style="--x: 10%; --y: 28%; --w: 26%; --r: -4deg; --z: 7;" aria-label="Open photo 5">
      <img src="fotooo/06.jpg" loading="lazy" alt="">
    </button>

    <button class="scatter-gallery__photo" data-index="14" style="--x: 42%; --y: 30%; --w: 16%; --r: 1deg; --z: 1;" aria-label="Open photo 6">
      <img src="fotooo/08.jpg" loading="lazy" alt="">
    </button>

    <button class="scatter-gallery__photo" data-index="4" style="--x: 62%; --y: 26%; --w: 21%; --r: -1deg; --z: 4;" aria-label="Open photo 7">
      <img src="fotooo/09.jpg" loading="lazy" alt="">
    </button>

    <button class="scatter-gallery__photo" data-index="11" style="--x: 82%; --y: 35%; --w: 15%; --r: 3deg; --z: 8;" aria-label="Open photo 8">
      <img src="fotooo/11.jpg" loading="lazy" alt="">
    </button>

    <button class="scatter-gallery__photo" data-index="12" style="--x: 3%; --y: 52%; --w: 19%; --r: -2deg; --z: 2;" aria-label="Open photo 9">
      <img src="fotooo/12.jpg" loading="lazy" alt="">
    </button>

    <button class="scatter-gallery__photo" data-index="7" style="--x: 26%; --y: 55%; --w: 23%; --r: 2deg; --z: 5;" aria-label="Open photo 10">
      <img src="fotooo/14.jpg" loading="lazy" alt="">
    </button>

    <button class="scatter-gallery__photo" data-index="5" style="--x: 55%; --y: 48%; --w: 17%; --r: -3deg; --z: 3;" aria-label="Open photo 11">
      <img src="fotooo/15.jpg" loading="lazy" alt="">
    </button>

    <button class="scatter-gallery__photo" data-index="6" style="--x: 74%; --y: 58%; --w: 20%; --r: 1deg; --z: 6;" aria-label="Open photo 12">
      <img src="fotooo/16.jpg" loading="lazy" alt="">
    </button>

    <button class="scatter-gallery__photo" data-index="8" style="--x: 8%; --y: 75%; --w: 18%; --r: 4deg; --z: 1;" aria-label="Open photo 13">
      <img src="fotooo/17.jpg" loading="lazy" alt="">
    </button>

    <button class="scatter-gallery__photo" data-index="9" style="--x: 32%; --y: 78%; --w: 22%; --r: -1deg; --z: 4;" aria-label="Open photo 14">
      <img src="fotooo/18.jpg" loading="lazy" alt="">
    </button>

    <button class="scatter-gallery__photo" data-index="10" style="--x: 60%; --y: 72%; --w: 25%; --r: 2deg; --z: 7;" aria-label="Open photo 15">
      <img src="fotooo/20.jpg" loading="lazy" alt="">
    </button>

    <button class="scatter-gallery__photo" data-index="15" style="--x: 80%; --y: 82%; --w: 16%; --r: -2deg; --z: 2;" aria-label="Open photo 16">
      <img src="fotooo/22.jpg" loading="lazy" alt="">
    </button>

  </main>

  <!-- Lightbox -->
  <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Photo viewer" hidden>
    <button class="lightbox__close" id="lightboxClose" aria-label="Close">×</button>
    <button class="lightbox__nav lightbox__nav--prev" id="lightboxPrev" aria-label="Previous photo">‹</button>
    <button class="lightbox__nav lightbox__nav--next" id="lightboxNext" aria-label="Next photo">›</button>
    <div class="lightbox__stage" id="lightboxStage">
      <img id="lightboxImage" src="" alt="">
    </div>
  </div>

  <script src="js/gallery.js"></script>
</body>
</html>
