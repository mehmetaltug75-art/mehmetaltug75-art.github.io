  </nav>

  <!-- Scatter gallery — positions are fixed, not random on reload -->
  <main class="scatter-gallery" id="scatterGallery">

    <button class="scatter-gallery__photo" data-index="13" style="--x: 50%; --y: 42%; --w: 28%; --r: 0deg; --z: 5;" aria-label="Open photo 01">
      <img src="fotooo/01.jpg" loading="eager" alt="Photo 01">
    </button>

    <button class="scatter-gallery__photo" data-index="3" style="--x: 30%; --y: 8%; --w: 18%; --r: 2deg; --z: 3;" aria-label="Open photo 03">
      <img src="fotooo/03.jpg" loading="eager" alt="Photo 03">
    </button>

    <button class="scatter-gallery__photo" data-index="2" style="--x: 55%; --y: 3%; --w: 24%; --r: -2deg; --z: 6;" aria-label="Open photo 04">
      <img src="fotooo/04.jpg" loading="eager" alt="Photo 04">

    <button class="scatter-gallery__photo" data-index="0" style="--x: 75%; --y: 12%; --w: 20%; --r: 4deg; --z: 2;" aria-label="Open photo 05">

  </main>

  <!-- Lightbox -->
  <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Photo viewer" hidden>
    <button class="lightbox__close" id="lightboxClose" aria-label="Close">×</button>
    <button class="lightbox__nav lightbox__nav--prev" id="lightboxPrev" aria-label="Previous photo">‹</button>
    <button class="lightbox__nav lightbox__nav--next" id="lightboxNext" aria-label="Next photo">›</button>
    <div class="lightbox__stage" id="lightboxStage">
      <img id="lightboxImage" src="" alt="">
    </div>
  </div>
