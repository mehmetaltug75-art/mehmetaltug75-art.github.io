<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Kotoba Study — Lessons 30–33</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
<div id="root"></div>
<script>
(async () => {
  const N = 6;
  try {
    const parts = await Promise.all([...Array(N)].map((_, i) =>
      fetch('p' + i + '.txt').then(r => { if (!r.ok) throw new Error('part ' + i); return r.text() })
    ));
    const b64 = parts.join('');
    const bin = Uint8Array.from(atob(b64), c => c.charCodeAt(0));
    const ds = new DecompressionStream('gzip');
    const decompressed = await new Response(new Blob([bin]).stream().pipeThrough(ds)).text();
    const s = document.createElement('script');
    s.src = URL.createObjectURL(new Blob([decompressed], { type: 'text/javascript' }));
    document.body.appendChild(s);
  } catch (e) {
    document.getElementById('root').innerHTML = '<p style="padding:2em;font-family:sans-serif">Yükleme hatası: ' + e.message + ' — sayfayı yenileyin.</p>';
  }
})();
</script>
</body>
</html>
